[workspace]
resolver = "2"
members = [
  "crates/crow-agent-protocol",
  "crates/crow-agent-core",
  "apps/crow-agentd",
  "apps/crow-dataset-publisher",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/crow-agent-protocol",
  "crates/crow-agent-core",
  "apps/crow-agentd",
  "apps/crow-dataset-publisher",
]

[workspace.package]
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Crow Compute <306424470+crow-compute@users.noreply.github.com>"]
repository = "https://github.com/crow-compute/crow-agent"

[workspace.dependencies]
async-trait = "0.1.89"
arrow-array = "=59.1.0"
arrow-schema = "=59.1.0"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.51", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.31"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
hypersdk = "=0.2.14"
interprocess = { version = "=2.4.2", features = ["tokio"] }
keyring = "=4.1.5"
open = "=5.4.0"
parquet = { version = "=59.1.0", default-features = false, features = ["arrow", "zstd"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
