name: signed-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-15
            target: universal-apple-darwin
            tauri_args: --target universal-apple-darwin
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        if: runner.os != 'Linux'
        working-directory: apps/desktop
      - run: npm run tauri build -- ${{ matrix.tauri_args }}
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Linux daemon
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p crow-agentd
          ./scripts/package-linux.sh \
            target/x86_64-unknown-linux-gnu/release/crow-agentd \
            target/x86_64-unknown-linux-gnu/release/crow-agent-linux-x86_64.tar.zst
      - name: Require macOS updater signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(find target/universal-apple-darwin/release/bundle \
            -type f -name '*.sig' | wc -l | tr -d ' ')" -ge 1
      - name: Require Windows updater signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signatures = Get-ChildItem `
            target/x86_64-pc-windows-msvc/release/bundle `
            -Recurse -File -Filter *.sig
          if ($signatures.Count -lt 1) {
            throw "No Windows updater signature was produced"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
            target/${{ matrix.target }}/release/crow-agent*
          if-no-files-found: error

  systemd-acceptance:
    name: systemd / ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64
      - name: Install acceptance dependencies
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3 zstd
      - name: Verify real systemd install and restart reconciliation
        run: |
          sudo ./scripts/test-systemd-install.sh \
            "$RUNNER_TEMP/linux-x86_64/crow-agent-linux-x86_64.tar.zst" \
            "$RUNNER_TEMP/systemd-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: systemd-${{ matrix.os }}
          path: ${{ runner.temp }}/systemd-${{ matrix.os }}.json
          if-no-files-found: error

  attest:
    name: Manifest, SBOM, scan, and signature
    needs: [build, systemd-acceptance]
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: release/artifacts/macos-universal
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: release/artifacts/windows-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: release/artifacts/linux-x86_64
      - id: syft
        uses: anchore/sbom-action/download-syft@v0
      - id: grype
        uses: anchore/scan-action/download-grype@v6
      - name: Add evidence tools to PATH
        env:
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
          GRYPE_COMMAND: ${{ steps.grype.outputs.cmd }}
        run: |
          dirname "$SYFT_COMMAND" >> "$GITHUB_PATH"
          dirname "$GRYPE_COMMAND" >> "$GITHUB_PATH"
      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsodium-dev pkg-config
          git clone --depth 1 --branch 0.12 \
            https://github.com/jedisct1/minisign.git \
            "$RUNNER_TEMP/minisign"
          test "$(git -C "$RUNNER_TEMP/minisign" rev-parse HEAD)" = \
            b85e15d45ac9eab34e44596fd309f5b07db9545c
          cmake -S "$RUNNER_TEMP/minisign" -B "$RUNNER_TEMP/minisign/build" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/minisign/build" --parallel
          sudo cmake --install "$RUNNER_TEMP/minisign/build"
      - name: Materialize signing credential
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          umask 077
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.minisign.key"
      - name: Create signed release evidence
        env:
          MINISIGN_SECRET_KEY_PATH: ${{ runner.temp }}/release.minisign.key
          RELEASE_SIGNER: crow-compute-release-v1
        run: |
          updater_public_key=$(jq -r '.plugins.updater.pubkey' \
            apps/desktop/src-tauri/tauri.conf.json)
          ./scripts/verify-tauri-updater-evidence.sh \
            release/artifacts/macos-universal \
            "$updater_public_key"
          ./scripts/verify-tauri-updater-evidence.sh \
            release/artifacts/windows-x86_64 \
            "$updater_public_key"
          ./scripts/build-release-evidence.sh release/artifacts release/evidence
          ./scripts/test-release-evidence.sh \
            release/evidence \
            "$MINISIGN_SECRET_KEY_PATH" \
            release/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-evidence
          path: release/evidence/**
          if-no-files-found: error
